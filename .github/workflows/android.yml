name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Tester les règles
        run: ./gradlew --no-daemon -p core test

      - name: Construire l'APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk minsapp.apk

      - uses: actions/upload-artifact@v7
        with:
          name: minsapp-apk
          path: minsapp.apk

      # Stable link for the phone: .../releases/download/latest/minsapp.apk
      - name: Publier l'APK (release « latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest minsapp.apk --prerelease --target "$GITHUB_SHA" \
            --title "Minsapp – dernière version" \
            --notes "APK construit automatiquement (build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}). Installation : voir le README."
